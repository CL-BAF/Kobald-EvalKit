[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kobald-evalkit"
version = "0.1.0"
description = "Standalone, provider-independent local AI evaluation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hack Club and project contributors" }]
keywords = ["evaluation", "llm", "local", "ollama", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalkit = "evalkit.cli:main"

[project.urls]
Homepage = "https://github.com/CL-BAF/Kobald-EvalKit"

[tool.setuptools]
packages = { find = { include = ["evalkit*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires running Ollama"]
addopts = "-m \"not live\""